name: FreeSWITCH integration

on:
  push:
    paths:
      - 'freeswitch/**'
      - 'apps/worker/**'
      - 'packages/**'
      - '.github/workflows/freeswitch.yml'
  pull_request:
    paths:
      - 'freeswitch/**'
      - 'apps/worker/**'
      - 'packages/**'
      - '.github/workflows/freeswitch.yml'
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freeswitch-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 检查构建令牌
        id: token
        env:
          SIGNALWIRE_TOKEN: ${{ secrets.SIGNALWIRE_TOKEN }}
        run: |
          if [[ -z "$SIGNALWIRE_TOKEN" ]]; then
            echo '::notice::SIGNALWIRE_TOKEN 未配置，跳过镜像构建。'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: 镜像名称
        if: steps.token.outputs.available == 'true'
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_HASH: ${{ hashFiles('freeswitch/install/**', 'freeswitch/docker/**') }}
        run: |
          echo "image=ghcr.io/${OWNER,,}/fs-billing-freeswitch" >> "$GITHUB_OUTPUT"
          echo "hash=$IMAGE_HASH" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.11.1
        if: steps.token.outputs.available == 'true'
      - uses: docker/login-action@v3.6.0
        if: steps.token.outputs.available == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6.18.0
        if: steps.token.outputs.available == 'true'
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: freeswitch/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ steps.name.outputs.hash }}
            ${{ steps.name.outputs.image }}:latest
          secrets: |
            signalwire_token=${{ secrets.SIGNALWIRE_TOKEN }}

  e2e:
    needs: image
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DATABASE_URL: postgresql://fs_billing:local-development-only@127.0.0.1:5432/fs_billing
      APP_DATABASE_URL: postgresql://fs_billing_app:local-app-only@127.0.0.1:5432/fs_billing
      FS_INTEGRATION_LOG_DIR: /tmp/fs-integration-ci
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 拉取私有镜像
        id: pull
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_HASH: ${{ hashFiles('freeswitch/install/**', 'freeswitch/docker/**') }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          image="ghcr.io/${OWNER,,}/fs-billing-freeswitch:$IMAGE_HASH"
          if printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin && docker pull "$image"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo "FS_IMAGE=$image" >> "$GITHUB_ENV"
          else
            echo "::notice::此 hash 的镜像尚未构建（$IMAGE_HASH），跳过 FreeSWITCH 联调；合并后在 main 上运行 workflow_dispatch。"
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6.1.0
        if: steps.pull.outputs.available == 'true'
      - uses: actions/setup-node@v7.1.0
        if: steps.pull.outputs.available == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.pull.outputs.available == 'true'
      - name: 启动 PostgreSQL
        if: steps.pull.outputs.available == 'true'
        run: docker compose up -d --wait postgres
      - name: SIP 与账本联调
        if: steps.pull.outputs.available == 'true'
        run: bash freeswitch/test/run-integration.sh "$FS_INTEGRATION_LOG_DIR"
      - name: 保存联调日志
        if: always() && steps.pull.outputs.available == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: freeswitch-integration
          path: /tmp/fs-integration-ci
          if-no-files-found: ignore
      - name: 停止 PostgreSQL
        if: always() && steps.pull.outputs.available == 'true'
        run: docker compose down
