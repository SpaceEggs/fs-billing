name: CI

# 分支只经 pull_request 跑一次；push 只看 main，免得同一提交跑两遍。
# 只忽略任何检查都不读的文件：design/ 已被 ESLint、prettier 排除，证据里的这些类型 prettier 不解析。
on:
  push:
    branches: [main]
    paths-ignore: &unchecked
      - 'design/**'
      - 'docs/evidence/**/*.png'
      - 'docs/evidence/**/*.txt'
      - 'docs/evidence/**/*.diff'
  pull_request:
    paths-ignore: *unchecked
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # 阶段 9 PR 5 起 test:db 含两个等真实分钟的文件（约 +4.5 分钟）；原来的 15 分钟会在 IDOR 步骤前后超时。
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://fs_billing:local-development-only@127.0.0.1:5432/fs_billing
      APP_DATABASE_URL: postgresql://fs_billing_app:local-app-only@127.0.0.1:5432/fs_billing
      AUTH_DATABASE_URL: postgresql://fs_billing_auth:local-auth-only@127.0.0.1:5432/fs_billing
      # 邮件（阶段 9）：docker compose 起的 Mailpit；这是 .env.example 的同一组值，没有任何真实凭据。
      # 邮件测试自己连 Mailpit（MAILPIT_* 的默认值就是这里的地址），不读 SMTP_*，免得开发机上的真实配置被测试用到。
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      MAIL_FROM: billing@example.test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.3
      - run: pnpm check
      - run: pnpm coverage
      - run: pnpm build
      - name: Reject CNY + USD at typecheck
        run: |
          probe=packages/rating/src/ci-currency-probe.ts
          trap 'rm -f "$probe"' EXIT
          printf "%s\n" "import { addMoney, money } from './money.js';" "export const total = addMoney(money('CNY', '1'), money('USD', '1'));" > "$probe"
          if pnpm --filter @fs-billing/rating typecheck > /tmp/currency-tsc.log 2>&1; then
            echo 'ERROR: CNY + USD was accepted'
            exit 1
          fi
          cat /tmp/currency-tsc.log
          grep -q "Money<\"USD\">" /tmp/currency-tsc.log
      - name: Reject native floating point money arithmetic
        run: |
          probe=packages/rating/src/ci-money-probe.ts
          trap 'rm -f "$probe"' EXIT
          echo 'export const fee = 0.1 * 3;' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/money-lint.log 2>&1; then
            echo 'ERROR: unsafe money arithmetic was accepted'
            exit 1
          fi
          cat /tmp/money-lint.log
          grep -q 'money/no-number-money' /tmp/money-lint.log
      - name: Reject local-timezone Date methods
        run: |
          probe=packages/rating/src/ci-time-probe.ts
          trap 'rm -f "$probe"' EXIT
          echo 'export const month = new Date(2026, 7, 31).getMonth();' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/time-lint.log 2>&1; then
            echo 'ERROR: local-timezone Date method was accepted'
            exit 1
          fi
          cat /tmp/time-lint.log
          grep -q 'no-restricted-syntax' /tmp/time-lint.log
          grep -q 'beijing-time.ts' /tmp/time-lint.log
      - name: Reject direct ledger and alert inserts
        run: |
          probe=apps/worker/src/ci-alert-probe.ts
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' 'export const write = (tx: { insert: (t: unknown) => unknown }, systemAlerts: unknown) => tx.insert(systemAlerts);' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/alert-lint.log 2>&1; then
            echo 'ERROR: direct systemAlerts insert was accepted'
            exit 1
          fi
          cat /tmp/alert-lint.log
          grep -q 'no-restricted-syntax' /tmp/alert-lint.log
          grep -q 'raiseAlert' /tmp/alert-lint.log
      - name: Reject console in runtime
        run: |
          probe=apps/api/src/ci-console-probe.ts
          trap 'rm -f "$probe"' EXIT
          echo 'export const fail = (error: unknown) => { console.error(error); };' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/console-lint.log 2>&1; then
            echo 'ERROR: console.error was accepted'
            exit 1
          fi
          cat /tmp/console-lint.log
          grep -q 'no-restricted-globals' /tmp/console-lint.log
          grep -q 'scrubErrorForLog' /tmp/console-lint.log
      - name: Reject undocumented eslint-disable
        run: |
          probe=apps/api/src/ci-disable-probe.ts
          trap 'rm -f "$probe"' EXIT
          printf '%s\n' '/* eslint-disable no-console */' 'export const ok = 1;' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/disable-lint.log 2>&1; then
            echo 'ERROR: undocumented eslint-disable was accepted'
            exit 1
          fi
          cat /tmp/disable-lint.log
          grep -q '@eslint-community/eslint-comments/require-description' /tmp/disable-lint.log
          grep -q '必须写明原因' /tmp/disable-lint.log
      - name: Reject direct fetch in web
        run: |
          probe=apps/web/src/ci-fetch-probe.ts
          trap 'rm -f "$probe"' EXIT
          echo 'export const load = () => fetch("/api/health");' > "$probe"
          if pnpm exec eslint "$probe" --format json > /tmp/fetch-lint.log 2>&1; then
            echo 'ERROR: direct fetch was accepted'
            exit 1
          fi
          cat /tmp/fetch-lint.log
          grep -q 'no-restricted-globals' /tmp/fetch-lint.log
          grep -q 'callApi' /tmp/fetch-lint.log
      - name: Start and verify PostgreSQL
        run: |
          docker compose up -d --wait
          docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "SELECT version(); SHOW timezone;"'
      - name: Migrate and seed an empty database, then migrate again
        run: pnpm db:migrate && pnpm db:seed && pnpm db:migrate
      - name: Database acceptance tests
        run: pnpm test:db
      - name: Live OpenAPI customer IDOR coverage and tenant filter mutation proof
        run: pnpm --filter @fs-billing/api prove:idor "$GITHUB_WORKSPACE/artifacts/phase-4-api"
      - name: Upload OpenAPI and isolation proof
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: phase-4-api-isolation
          path: artifacts/phase-4-api
          if-no-files-found: warn
      - name: PostgreSQL logs
        if: failure()
        run: docker compose logs
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fs_billing:local-development-only@127.0.0.1:5432/fs_billing
      APP_DATABASE_URL: postgresql://fs_billing_app:local-app-only@127.0.0.1:5432/fs_billing
      AUTH_DATABASE_URL: postgresql://fs_billing_auth:local-auth-only@127.0.0.1:5432/fs_billing
      # 仅用于 CI 一次性数据库的开发种子密码；会话签名密钥由 Playwright 配置每次随机生成。
      SEED_AUTH_PASSWORD: ci-web-e2e-only-password
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fs-billing/web exec playwright install --with-deps chromium
      - name: Start PostgreSQL, migrate and seed
        run: |
          docker compose up -d --wait
          pnpm db:migrate && pnpm db:seed
      - name: Web e2e against the real API and PostgreSQL
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: phase-4-web-playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
      - name: PostgreSQL logs
        if: failure()
        run: docker compose logs
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down

  # 运维骨架的静态检查。与本地复现使用同一条 docker run 命令：
  #   docker run --rm --cap-add=NET_ADMIN -v "$PWD":/w:ro -w /w debian:13 bash -c '...'
  # nft -c 只解析不应用，但初始化 netlink 缓存需要 NET_ADMIN；挂载始终只读。
  ops-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck、nft -c、systemd-analyze verify、nginx -t
        run: |
          docker run --rm --cap-add=NET_ADMIN \
            -v "$PWD":/w:ro -w /w debian:13 bash -c '
            set -euo pipefail
            shopt -s globstar
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              shellcheck nftables nginx systemd openssl netbase >/dev/null

            # 1. 所有运维 shell 脚本
            shellcheck ops/**/*.sh

            # 2. nftables：只校验语法，不加载规则
            nft -c -f ops/firewall/nftables-b.conf
            nft -c -f ops/firewall/nftables-a.conf

            # 3. systemd 单元：准备单元里出现的用户、目录、node 占位与环境文件
            id fs-billing >/dev/null 2>&1 ||
              useradd --system --no-create-home --shell /usr/sbin/nologin fs-billing
            install -d /opt/fs-billing/current/apps/api /opt/fs-billing/current/apps/worker
            install -d -o fs-billing -g fs-billing /var/lib/fs-billing
            install -m 0755 /bin/true /usr/local/bin/node
            install -d /etc/fs-billing
            : > /etc/fs-billing/app.env
            systemd-analyze verify \
              ops/deploy/systemd/fs-billing-api.service \
              ops/deploy/systemd/fs-billing-worker.service

            # 4. nginx：临时主配置包含站点片段，证书与 web 根目录用临时占位
            install -d /etc/ssl/fs-billing /var/log/nginx /opt/fs-billing/current/apps/web/dist
            openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
              -subj /CN=test -addext subjectAltName=IP:127.0.0.1 \
              -keyout /etc/ssl/fs-billing/privkey.pem \
              -out /etc/ssl/fs-billing/fullchain.pem >/dev/null 2>&1
            tmp=$(mktemp -d)
            printf "%s\n" \
              "worker_processes 1;" \
              "error_log $tmp/error.log;" \
              "pid $tmp/nginx.pid;" \
              "events { worker_connections 64; }" \
              "http {" \
              "  include /etc/nginx/mime.types;" \
              "  access_log $tmp/access.log;" \
              "  include /w/ops/deploy/nginx/fs-billing.conf;" \
              "}" > "$tmp/nginx.conf"
            nginx -t -c "$tmp/nginx.conf" -p "$tmp"
          '
