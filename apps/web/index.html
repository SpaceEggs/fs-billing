<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FS-Billing</title>
    <link rel="icon" href="/favicon-portal.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // 首屏前应用主题与区域，避免刷新闪烁；键名与 src/lib/theme.ts 一致。
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('fs-billing.theme');
        } catch (e) {}
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        var locale = null;
        try {
          locale = localStorage.getItem('fs-billing.locale');
        } catch (e) {}
        if (locale !== 'zh' && locale !== 'en') {
          var languages =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : navigator.language
                ? [navigator.language]
                : [];
          var first = languages[0];
          locale = first
            ? first.toLowerCase().indexOf('zh') === 0
              ? 'zh'
              : 'en'
            : 'zh';
        }
        root.lang = locale === 'zh' ? 'zh-CN' : 'en';
        // 标题按语言设置；产品名 FS-Billing 两种语言相同，中文保持原值。
        document.title = locale === 'zh' ? 'FS-Billing' : 'FS-Billing';
        var path = location.pathname;
        root.dataset.product =
          path === '/admin' || path.indexOf('/admin/') === 0
            ? 'admin'
            : 'portal';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
