# 放在 FreeSWITCH 机器的 nginx http 块中；仅本机 mod_json_cdr 与重推脚本可连接。
server {
    listen 127.0.0.1:3002;
    server_name localhost;
    client_max_body_size 1m;

    location = /cdr {
        limit_except POST { deny all; }
        # 改成 Worker 内网地址，密钥与 WORKER_SHARED_KEY 一致。
        proxy_pass http://10.0.0.20:3001/cdr;
        proxy_set_header X-Billing-Key "replace-this-worker-shared-key";
        proxy_set_header Content-Type application/json;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
