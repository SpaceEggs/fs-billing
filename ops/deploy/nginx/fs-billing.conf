# FS-Billing Web 与 API 反向代理。
# 安装在 /etc/nginx/conf.d/fs-billing.conf，由 /etc/nginx/nginx.conf 的 http 块包含。
# 日志不写自定义格式、不改保留期，沿用 Debian 默认的 access.log/error.log（阶段 10 决定 6）。
# 证书路径由 ops/deploy/bootstrap-server.sh 生成；域名到位后由 certbot --nginx 接管。

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/ssl/fs-billing/fullchain.pem;
    ssl_certificate_key /etc/ssl/fs-billing/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # CSV 导入上限 2 MiB，留出 multipart 余量。
    client_max_body_size 3m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS 等域名与正式证书到位后再开，避免自签阶段把浏览器锁在错误证书上。

    root /opt/fs-billing/current/apps/web/dist;
    index index.html;

    # 带 hash 的构建产物长缓存；expires 不用 add_header，避免覆盖上面的安全响应头。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # 入口页不缓存，发布后浏览器立即拿到新的 asset 引用。
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri /index.html;
    }

    # 导出接口可能持续数分钟；流式响应，不缓冲。API 总时限约 300 秒，这里留 330 秒。
    location ~ ^/api/.*/export$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加客户端自带的 X-Forwarded-For，限流按真实来源地址分桶。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }
}
