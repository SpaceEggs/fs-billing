# 安装在 /etc/ssh/sshd_config.d/00-fs-billing.conf（Debian 13 会包含该目录）。
# 文件名用 00- 前缀：sshd 对同一项只取第一次读到的值，而片段按字典序加载，
# 云镜像的 50-cloud-init.conf（PasswordAuthentication yes）会覆盖更晚的片段。
# 任意来源都可以连 22，但只接受密钥；nftables 另按来源限制新建连接速率。
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
