# chrony 片段：安装到两台的 /etc/chrony/conf.d/fs-billing.conf（阶段 10 验收 8）。
# Debian 的 /etc/chrony/chrony.conf 已包含 confdir /etc/chrony/conf.d。
#
# 至少 3 个时间源。下面用 Debian 的 NTP 池作为默认；机房屏蔽公网 NTP 时，把 pool
# 行替换成机房提供的 3 个源（地址由用户提供，不写进仓库）。chrony 用 iburst 加快
# 首次同步，makestep 只在启动后的前三次校时里允许直接跳变，避免运行中反复跳。
pool 0.debian.pool.ntp.org iburst
pool 1.debian.pool.ntp.org iburst
pool 2.debian.pool.ntp.org iburst

makestep 1.0 3
rtcsync
