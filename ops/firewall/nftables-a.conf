#!/usr/sbin/nft -f

# 服务器 A（FreeSWITCH）的防火墙。按 docs/freeswitch.md §5：对公网只开
# SIP 5060/5061、RTP 范围与 SSH；出站只保留业务必需的 DNS、NTP、apt/证书、
# 上游 SIP/RTP，以及到服务器 B 的 Worker 端口。
#
# 应用：
#   nft -c -f ops/firewall/nftables-a.conf
#   install -m 0644 ops/firewall/nftables-a.conf /etc/nftables.conf
#   systemctl restart nftables
#
# RTP 范围要与 FreeSWITCH 的 rtp-start-port/rtp-end-port 一致；示例为仓库
# freeswitch/test/conf 的 16384–16483。生产改范围时同步这里。

define FS_B_IP = 203.0.113.20
# 与 FreeSWITCH 的 rtp-start-port/rtp-end-port 一致；用连字符写成端口范围。
define RTP_RANGE = 16384-16483

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH：每个来源 6 次/分钟、突发 4 个新建连接；超出后丢弃。
        tcp dport 22 ct state new meter ssh_rate_v4 { ip saddr limit rate 6/minute burst 4 packets } accept
        tcp dport 22 ct state new meter ssh_rate_v6 { ip6 saddr limit rate 6/minute burst 4 packets } accept
        tcp dport 22 drop

        # SIP 与 RTP
        udp dport 5060 accept
        tcp dport { 5060, 5061 } accept
        udp dport $RTP_RANGE accept
    }

    chain output {
        type filter hook output priority filter; policy drop;

        oif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # 系统维护：DNS、NTP、apt 与 certbot。
        udp dport 53 accept
        tcp dport 53 accept
        udp dport 123 accept
        tcp dport { 80, 443 } accept

        # 上游运营商：SIP 与 RTP。RTP 要按我们的源端口范围判定，运营商侧的
        # 目的端口不固定；SIP 也放行源端口 5060，不能假定对方一定监听 5060。
        udp sport 5060 accept
        udp dport 5060 accept
        tcp dport { 5060, 5061 } accept
        udp sport $RTP_RANGE accept

        # 服务器 B 的 Worker（只开 3001，其余端口不放行）。
        ip daddr $FS_B_IP tcp dport 3001 accept
        # WireGuard 隧道：A 侧隧道地址访问 B 的 Worker，以及到 B 公网端口的握手。
        # ip daddr 10.66.0.1 tcp dport 3001 accept
        # ip daddr $FS_B_IP udp dport 51820 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
