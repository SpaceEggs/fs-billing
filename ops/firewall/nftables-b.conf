#!/usr/sbin/nft -f

# 服务器 B（应用与数据库）的入站防火墙。默认丢弃，只开放必要端口。
#
# 应用：
#   nft -c -f ops/firewall/nftables-b.conf
#   install -m 0644 ops/firewall/nftables-b.conf /etc/nftables.conf
#   systemctl restart nftables
# bootstrap-server.sh 会按 --fs-a-ip 替换下面的 FS_A_IP 后安装。
#
# 22 端口对任意来源开放，但只接受密钥登录（见 ops/deploy/sshd/fs-billing.conf）；
# 这里再按来源限制新建连接速率，超出的包直接丢弃。
# 5432、3000 不对外：PostgreSQL 只监听 localhost，API 只监听回环，由 nginx 代理。
# Worker 3001 只允许服务器 A。

define FS_A_IP = 203.0.113.10

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif lo accept
        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # SSH：每个来源 6 次/分钟、突发 4 个新建连接；超出后丢弃。
        tcp dport 22 ct state new meter ssh_rate_v4 { ip saddr limit rate 6/minute burst 4 packets } accept
        tcp dport 22 ct state new meter ssh_rate_v6 { ip6 saddr limit rate 6/minute burst 4 packets } accept
        tcp dport 22 drop

        tcp dport { 80, 443 } accept

        # 服务器 A -> Worker。A 没有内网地址时改用 WireGuard 隧道地址，
        # 同时取消下面两行注释（隧道接口与 UDP 端口）。
        ip saddr $FS_A_IP tcp dport 3001 accept
        # iifname "wg0" tcp dport 3001 accept
        # udp dport 51820 ip saddr $FS_A_IP accept
    }

    # 出站保持放行：SMTP 465、certbot、NTP、apt 都需要。
    chain output {
        type filter hook output priority filter; policy accept;
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }
}
